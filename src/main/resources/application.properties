spring.application.name=apitaconube
server.port=8083

# MySQL Connection
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3308}/${DATABASE_NAME:taconube_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DATABASE_USERNAME:josesas}
spring.datasource.password=${DATABASE_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

#Swagger doc
# Configuración de Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Para habilitar la autorización JWT en Swagger UI
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Si quieres deshabilitar Swagger en producción
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Subida de archivos (iconos de negocio)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Storage: hoy en disco local. Cuando migremos a DigitalOcean Spaces,
# app.storage.base-url pasa a ser la URL del bucket/CDN y LocalStorageService
# se reemplaza por una implementacion de StorageService que hable con Spaces.
app.storage.upload-dir=${STORAGE_UPLOAD_DIR:uploads}
app.storage.base-url=${STORAGE_BASE_URL:http://localhost:8083/uploads}